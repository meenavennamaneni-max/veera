<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presentation — Microsoft PowerPoint | Class C3-A</title>
  <meta name="description" content="Watch the full Microsoft PowerPoint presentation — advantages, disadvantages, uses and more. Class C3-A." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff8a3c'/%3E%3Cstop offset='.55' stop-color='%23f4511e'/%3E%3Cstop offset='1' stop-color='%23d92c17'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='bold' fill='%23fff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="page--presentation">
  <div class="grain" aria-hidden="true"></div>

  <header class="pbar">
    <div class="pbar__inner">
      <a class="btn btn--ghost btn--sm" href="/">
        <span class="btn__arrow btn__arrow--left" aria-hidden="true">←</span> Back to Home
      </a>

      <div class="pbar__title">
        <span class="brand__mark brand__mark--sm" aria-hidden="true">P</span>
        <span class="pbar__text">
          <strong>Microsoft PowerPoint</strong>
          <small>Advantages • Disadvantages • Uses &amp; More — C3-A</small>
        </span>
      </div>

      <div class="pbar__actions">
        <a class="pbar__link" href="/pre.pdf" target="_blank" rel="noopener">
          Open PDF <span aria-hidden="true">↗</span>
        </a>
        <a class="pbar__link pbar__link--hide-sm" href="/pre.pdf" download>
          Download
        </a>
      </div>
    </div>
  </header>

  <main class="pmain">
    <div class="viewer">
      <div class="viewer__loading" id="pdfLoading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading presentation…</p>
      </div>
      <iframe
        id="pdfFrame"
        src="/pre.pdf"
        title="Microsoft PowerPoint presentation (PDF)"
        loading="eager"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
  </main>

  <footer class="pfoot">
    <div class="pfoot__inner">
      <span>Microsoft PowerPoint Presentation</span>
      <span class="pfoot__dot" aria-hidden="true">•</span>
      <span>Devaansh • Gowtham • Gowtham Ganesh | C3-A</span>
    </div>
  </footer>

  <script>
    (function () {
      var frame = document.getElementById('pdfFrame');
      var loading = document.getElementById('pdfLoading');

      function hide() { loading.classList.add('viewer__loading--done'); }
      frame.addEventListener('load', hide);

      // Safety net — if the browser PDF viewer never fires load, fade the
      // overlay out anyway so the viewer is never blocked.
      setTimeout(hide, 4000);

      // Keep the PDF in view-friendly scroll steps on touch devices.
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') window.location.href = '/';
      });
    })();
  </script>
</body>
</html>
